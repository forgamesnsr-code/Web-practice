<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo list</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Подключаем JS-файл с логикой добавления/удаления задач -->
    <script src="js/todo.js" defer></script>
</head>
<body class="page-todo">
    <div class="container">
        <h1 class="title">Мои задачи</h1>

        <!-- Поле ввода и кнопка добавления (с SVG-иконкой плюса) -->
        <div id="newtask">
            <input type="text" placeholder="Введите описание задачи...">
            <button id="push" aria-label="Добавить задачу">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5"  x2="12" y2="19"></line>
                    <line x1="5"  y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- Сюда JavaScript будет добавлять новые задачи -->
        <div id="tasks"></div>
    </div>
</body>
</html>
